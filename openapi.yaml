openapi: 3.0.0
info:
  title: Smart Expense Tracker API
  version: 1.0.0
  description: A C#/.NET REST API for managing personal expenses.
servers:
  - url: http://localhost:5000

paths:
  /expenses:
    get:
      summary: List all expenses
      parameters:
        - in: query
          name: category
          schema:
            type: string
          description: Filter expenses by category
      responses:
        '200':
          description: A list of expenses
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Expense'
    post:
      summary: Create a new expense
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExpenseInput'
      responses:
        '201':
          description: Expense created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Expense'
        '400':
          description: Validation error

  /expenses/{id}:
    get:
      summary: Get a single expense by id
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The expense
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Expense'
        '404':
          description: Expense not found
    put:
      summary: Update an expense
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExpenseInput'
      responses:
        '200':
          description: Updated expense
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Expense'
        '400':
          description: Validation error
        '404':
          description: Expense not found
    delete:
      summary: Delete an expense by id
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Expense deleted
        '404':
          description: Expense not found

  /expenses/totals/summary:
    get:
      summary: Get total expenses (overall or filtered by category)
      parameters:
        - in: query
          name: category
          schema:
            type: string
          description: If provided, returns total for just this category
      responses:
        '200':
          description: Totals
          content:
            application/json:
              schema:
                type: object

components:
  schemas:
    Expense:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        amount:
          type: number
        category:
          type: string
        date:
          type: string
          format: date
    ExpenseInput:
      type: object
      required:
        - title
        - amount
        - category
      properties:
        title:
          type: string
        amount:
          type: number
        category:
          type: string
        date:
          type: string
          format: date
